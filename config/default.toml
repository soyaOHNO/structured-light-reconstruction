# 構造化光計測の共通設定。
#
# 解像度・露光・枚数を変えるときは、必ずこのファイルだけを編集してください。
# 同じ値をスクリプト側にも書くと、食い違ったときに原因が分からなくなります。

[projector]
# 投影解像度。プロジェクタの表示設定と一致させること。
width = 1920
height = 1080

# 表示位置。auto = true で「メイン画面の右隣・上端揃え」に自動配置します。
# プロジェクタを別の位置に置いている場合のみ auto = false にして x, y を指定します。
auto = true
x = 0
y = 0

[camera]
# RAW16 で取得します。デコードは輝度の線形性を前提とするため、
# デモザイク済みの RGB8 ではなく RAW を保存します。
pixel_format = "BayerRG16"

# 自動露光・自動ゲイン・自動ホワイトバランスはすべて無効にします。
# パターンごとに明るさが変わるとデコードが破綻するためです。
exposure_time_us = 5000
gain_db = 0.0

# ガンマは 1.0 固定。ガンマ補正は輝度の線形性を壊します。
gamma = 1.0

# ホワイトバランス比（自環境で測定した値）。
white_balance_red = 1.528
white_balance_blue = 2.433

# 1 パターンあたりの撮影枚数。2 枚以上なら平均してノイズを抑えます。
frames_per_pattern = 1

# NewestOnly は必須。これを設定しないとバッファに溜まった古いフレームを
# 掴んでしまい、投影パターンと撮影画像が 1 枚ずれます。
buffer_handling = "NewestOnly"

[pattern]
# OpenCV の GrayCodePattern を使います。水平・垂直の両方向と、反転した相補
# パターンが常に生成されるため、これらを個別に切り替える設定はありません。
# 相補パターンを使うと固定しきい値が不要になり、画素ごとの大小比較で判定できます。
#
# ビット数は投影解像度から自動計算されます。
#   1920 x 1080 -> (11 bit + 11 bit) x 2 = 44 枚
#
# 有効画素マスクと正規化のため、全白・全黒も撮影列に加えます（合計 46 枚）。
include_white_black = true

[capture]
# パターンを表示してからカメラを露光するまでの待機時間（秒）。
# プロジェクタの応答と液晶の切り替わりを待ちます。短すぎると前のパターンが写ります。
warmup_sec = 1.0

[decode]
# 有効画素とみなすための、全白と全黒の輝度差（フルスケールに対する比）。
# 影になっている画素や、投影光が届かない背景を除外します。
mask_threshold = 0.05

# 各ビットの判定に必要な、パターンと反転パターンの輝度差。その画素自身の
# 振れ幅（全白と全黒の差）に対する比で指定します。絶対値ではなく比にすることで、
# 対象の反射率、レンズ周辺の減光、Bayer 配列による色ごとの感度差を吸収します。
bit_threshold = 0.2

# 最も細かい側から使わないビット数。
#
# 縞幅が 1〜2 投影画素になるパターンは光学的に解像できず、ぼけて潰れます。
# 全ビットが揃わないと画素が無効になるため、解像できないビットを使うと
# 有効画素が大幅に減ります。飛ばした分だけ分解能は粗くなります
# （1 で 2 投影画素単位、2 で 4 投影画素単位）。
#
# 適切な値は光学系とピントで変わります。03_decode.py が各ビットの通過率を
# 表示するので、急に落ちるビットの数を目安にしてください。
skip_fine_bits = 2

[calibration]
# チェッカーボードの「内側の交点」の数。マスの数ではありません。
# 白黒のマスが 9 x 6 のボードなら、交点は 8 x 5 になります。
#
# どちらか分からない場合は、1 姿勢だけ撮影して次を実行すると実測できます。
#   uv run --no-sync python scripts/05_calibrate.py <実験名> --probe
columns = 8
rows = 5

# 1 マスの一辺の実寸（mm）。この値が復元結果のスケールを決めるので、
# 印刷したボードを定規で実測した値を入れてください。
square_size_mm = 10.0

# 交点検出用の画像を撮るときの露光時間（µs）。
#
# チェッカーボードにプロジェクタの光を当てると、光沢のある面では微細な鏡面
# 反射が起きて白黒の区別がつかなくなります。そこで交点検出用の 1 枚だけは
# プロジェクタを消し、部屋の照明（拡散光）で撮ります。部屋の照明はプロジェクタ
# より暗いので、露光を長くとります。
#
# 明るすぎ・暗すぎる場合は 04_capture_calibration.py が実測値を表示するので、
# それを見て調整してください。
ambient_exposure_us = 20000

# キャリブレーションに使う最小の姿勢数。少ないと精度が出ません。
min_poses = 8

# プロジェクタ座標を求めるときに、交点のまわりで参照する範囲（画素）。
# この範囲のデコード結果から局所的な射影変換を当てはめ、交点のサブピクセル
# 位置をプロジェクタ座標へ変換します。狭すぎると点が足りず、広すぎると
# 平面から外れた部分を巻き込みます。
corner_window = 30

[reconstruct]
# 復元する奥行きの範囲（mm、カメラからの距離）。この範囲を外れた点は捨てます。
# 誤ったデコードは、とんでもなく近い／遠い点として現れることが多いためです。
min_depth_mm = 100.0
max_depth_mm = 3000.0

# 再投影誤差の上限（画素）。三角測量した点を両方の像に投影し直し、元の画素から
# これ以上ずれていた点は捨てます。2 本の光線がきれいに交わらなかった点、つまり
# デコードを誤った画素を落とせます。
max_reprojection_error_px = 1.0

[paths]
# すべてプロジェクトルートからの相対パスとして解決します。
patterns = "data/patterns"
raw = "data/raw"
results = "data/results"
